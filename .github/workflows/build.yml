name: Build Geode mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    name: Android ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [Android32, Android64]
    steps:
      - uses: actions/checkout@v4

      # geode-sdk/bindings main currently fails to compile for Android on GD 2.2091:
      #   bindings/2.2091/inline/PlayerObject.cpp:35: use of undeclared identifier 'm_ringRelatedSet'
      # This mod never touches PlayerObject, so we clone the bindings ourselves and comment out
      # that one line. Once upstream is fixed this step does nothing harmful (the pattern won't match).
      - name: Clone and patch Geode bindings
        run: |
          git clone --depth 1 https://github.com/geode-sdk/bindings "$RUNNER_TEMP/bindings"
          F="$RUNNER_TEMP/bindings/bindings/2.2091/inline/PlayerObject.cpp"
          grep -n "m_ringRelatedSet" "$F" || true
          sed -i 's|^\(.*new (&m_ringRelatedSet).*\)$|// patched out: \1|' "$F"
          grep -n "m_ringRelatedSet" "$F" || true
          echo "GEODE_BINDINGS_REPO_PATH=$RUNNER_TEMP/bindings" >> "$GITHUB_ENV"

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # Geode 6 (GD 2.2091 support) is not the 'latest' release yet, so build against the main branch.
          sdk: nightly
          # Second upstream bindings bug: GJGameLevel::GJGameLevel() ends up defined twice in
          # libGeodeBindings.a, so the final link fails. The mod never uses it, so let the linker keep the first.
          configure-args: -DGEODE_BINDINGS_REPO_PATH=${{ runner.temp }}/bindings -DCMAKE_SHARED_LINKER_FLAGS=-Wl,--allow-multiple-definition
          target: ${{ matrix.target }}
          combine: true

  package:
    name: Combine Android builds
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Combine Geode packages
        uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: MobileWindowMenu-Android32-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
