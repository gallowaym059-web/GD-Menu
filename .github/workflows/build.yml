name: Build Geode mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    name: Android ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [Android32, Android64]
    steps:
      - uses: actions/checkout@v4
      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # Geode 6 (GD 2.2091 support) is not the 'latest' release yet, so build against the main branch.
          sdk: nightly
          # If the build fails inside GeodeBindings (not in src/), pin the bindings to an older
          # commit from https://github.com/geode-sdk/bindings/commits/main and uncomment:
          # bindings-ref: PASTE_COMMIT_HASH_HERE
          target: ${{ matrix.target }}
          combine: true

  package:
    name: Combine Android builds
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Combine Geode packages
        uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: MobileWindowMenu-Android32-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
